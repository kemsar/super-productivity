<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      `script-src 'self' 'unsafe-inline'` — `'self'` lets us pull the
      shared parser out of `./shared-with-frontend/` as a plain `<script src>`,
      `'unsafe-inline'` covers the overlay's own logic. Not swapping to
      `type="module"` on purpose: Electron file:// origins block ES-module
      imports on CORS, and a UMD-shaped parser (see quick-add-parser.js)
      dodges the problem without a preload or bundler in the loop.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src http://127.0.0.1:3876"
    />
    <title>Quick Add</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1e1e1e;
        --fg: #f5f5f5;
        --fg-muted: #999;
        --border: #333;
        --accent: #4f8dff;
        --error: #ff5252;
        --warn: #ffb347;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 20px;
        box-sizing: border-box;
      }
      .hint {
        font-size: 12px;
        color: var(--fg-muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 10px;
      }
      /* Title line — a single-line textarea (rows=1) so Enter can carry the
         "submit" semantic while Shift+Enter (or a downward-arrow keystroke)
         drops into the description drawer. `resize:none` and a hard-coded
         height keep the overlay's chrome stable. */
      #title {
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        color: var(--fg);
        font-size: 22px;
        line-height: 1.3;
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
        resize: none;
        font-family: inherit;
        overflow: hidden;
        height: 34px;
      }
      #title:focus {
        border-bottom-color: var(--accent);
      }
      /* Description drawer — hidden until the user pushes Enter-with-Shift
         or the down-arrow / Tab. Grows organically; capped at ~5 lines then
         scrolls. Muted styling keeps it visually secondary to the title. */
      #description {
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        color: var(--fg-muted);
        font-size: 14px;
        line-height: 1.4;
        padding: 8px 0 0;
        resize: none;
        font-family: inherit;
        min-height: 24px;
        max-height: 110px;
      }
      #description.hidden {
        display: none;
      }
      #description::placeholder {
        color: var(--fg-muted);
        opacity: 0.6;
      }
      #status {
        margin-top: 12px;
        font-size: 13px;
        min-height: 18px;
        color: var(--fg-muted);
      }
      #status.error {
        color: var(--error);
      }
      #status.saving {
        color: var(--accent);
      }
      /* Live-parsed preview — a strip of chips populated by the parser.
         Each chip labels the token kind and shows the resolved value (or an
         unresolved warning). The whole strip hides when there's nothing to
         show, so a plain "walk the dog" title has zero decoration. */
      .parse-preview {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 12px;
        min-height: 22px;
      }
      .parse-preview .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: rgba(79, 141, 255, 0.15);
        color: var(--accent);
        border-radius: 3px;
        padding: 2px 8px;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 11px;
        line-height: 1.4;
      }
      .parse-preview .chip .k {
        color: var(--fg-muted);
      }
      .parse-preview .chip.warn {
        background: rgba(255, 179, 71, 0.15);
        color: var(--warn);
      }
      .parse-preview .chip.error {
        background: rgba(255, 82, 82, 0.15);
        color: var(--error);
      }
      .keys {
        margin-top: auto;
        display: flex;
        gap: 16px;
        font-size: 11px;
        color: var(--fg-muted);
        flex-wrap: wrap;
      }
      kbd {
        background: #2a2a2a;
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 2px 6px;
        font-family: inherit;
        font-size: 10px;
        margin-right: 4px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="hint">Quick add task</div>
      <textarea
        id="title"
        rows="1"
        autofocus
        placeholder="What's on your mind? Try: Fix login bug !EIP @kevin ##v2 ~fri !!high >doing"
        autocomplete="off"
        spellcheck="false"
        aria-label="Task title with optional !project @user ##milestone ~date !!priority >status tokens"
      ></textarea>
      <textarea
        id="description"
        class="hidden"
        rows="1"
        placeholder="Description (optional)"
        autocomplete="off"
        spellcheck="false"
        aria-label="Task description"
      ></textarea>
      <div
        id="parse-preview"
        class="parse-preview"
      ></div>
      <div id="status"></div>
      <div class="keys">
        <span><kbd>Enter</kbd>save</span>
        <span><kbd>Shift+Enter</kbd>description</span>
        <span
          ><kbd>!prj</kbd> <kbd>@who</kbd> <kbd>##ms</kbd> <kbd>~date</kbd>
          <kbd>!!pri</kbd> <kbd>&gt;stat</kbd></span
        >
        <span><kbd>Esc</kbd>cancel</span>
      </div>
    </div>
    <!--
      Load the shared parser via plain <script src>. See the CSP comment
      above for why we're NOT using type="module" here. `SPQuickAddParser`
      lands as a global containing `parseQuickAddText` / `resolveDateToken`.
    -->
    <script src="./shared-with-frontend/quick-add-parser.js"></script>
    <script>
      // Self-contained overlay logic. Talks to SP via the local REST API on
      // 127.0.0.1:3876 (GET /projects, POST /tasks). Grammar/parsing lives
      // in shared-with-frontend/quick-add-parser.js so the Angular effect
      // can re-parse from the same source (issue #19).
      (function () {
        const REST = 'http://127.0.0.1:3876';
        const titleEl = document.getElementById('title');
        const descEl = document.getElementById('description');
        const status = document.getElementById('status');
        const preview = document.getElementById('parse-preview');
        const parseText = window.SPQuickAddParser
          ? window.SPQuickAddParser.parseQuickAddText
          : null;

        if (!parseText) {
          // Parser failed to load — the overlay is unusable. Fail loud so
          // devtools shows the reason rather than pretending to work with a
          // degraded (project-marker-only) grammar the user won't notice.
          status.textContent = 'Parser failed to load — check devtools.';
          status.className = 'error';
        }

        // Projects, loaded once on open. Small enough to cache in memory;
        // token/title comparisons stay case-insensitive so `!odin-pipes`
        // matches "ODIN Pipes" without hyphen-vs-space bikeshedding.
        let projects = [];

        async function loadProjects() {
          try {
            const res = await fetch(REST + '/projects');
            if (!res.ok) return;
            const body = await res.json();
            projects = Array.isArray(body) ? body : body.data || [];
          } catch (err) {
            console.warn('[quick-add] failed to load projects', err);
          }
        }

        function normalize(s) {
          return String(s || '')
            .toLowerCase()
            .replace(/[^a-z0-9]/g, '');
        }

        function resolveProject(token) {
          if (!token) return null;
          const needle = normalize(token);
          if (!needle) return null;
          const exact = projects.find((p) => normalize(p.title) === needle);
          if (exact) return exact;
          const prefix = projects.find((p) => normalize(p.title).startsWith(needle));
          return prefix || null;
        }

        function escapeHtml(s) {
          return String(s).replace(/[&<>"']/g, (c) => {
            switch (c) {
              case '&':
                return '&amp;';
              case '<':
                return '&lt;';
              case '>':
                return '&gt;';
              case '"':
                return '&quot;';
              default:
                return '&#39;';
            }
          });
        }

        function chip(kind, value, cls) {
          const c = document.createElement('span');
          c.className = 'chip' + (cls ? ' ' + cls : '');
          c.innerHTML =
            '<span class="k">' + escapeHtml(kind) + '</span>' + escapeHtml(value);
          return c;
        }

        // Build the raw input the parser expects. Line 1 is the title
        // textarea's content; line 2+ is the description drawer if it has
        // any text. Keeping the textareas separate on-screen but joining
        // them at parse time lets the parser stay a single-string function.
        function currentRaw() {
          const t = titleEl.value;
          const d = descEl.value;
          return d.length ? t + '\n' + d : t;
        }

        function updatePreview() {
          if (!parseText) return;
          preview.innerHTML = '';
          const parsed = parseText(currentRaw());

          if (parsed.projectMarker) {
            const project = resolveProject(parsed.projectMarker);
            if (project) {
              preview.appendChild(chip('project', project.title));
            } else {
              preview.appendChild(
                chip('project', '!' + parsed.projectMarker + ' (no match)', 'error'),
              );
            }
          }
          for (const a of parsed.assignees) {
            preview.appendChild(chip('assign', '@' + a));
          }
          if (parsed.milestone) {
            preview.appendChild(chip('milestone', parsed.milestone));
          }
          if (parsed.dueDate) {
            preview.appendChild(chip('due', parsed.dueDate));
          } else if (parsed.dueDateRaw) {
            preview.appendChild(chip('due', '~' + parsed.dueDateRaw + ' (?)', 'warn'));
          }
          if (parsed.priority) {
            preview.appendChild(chip('priority', parsed.priority));
          } else if (parsed.priorityRaw) {
            preview.appendChild(
              chip('priority', '!!' + parsed.priorityRaw + ' (?)', 'warn'),
            );
          }
          if (parsed.status) {
            preview.appendChild(chip('status', parsed.status));
          }
          if (parsed.description) {
            const len = parsed.description.length;
            preview.appendChild(chip('desc', len + (len === 1 ? ' char' : ' chars')));
          }
        }

        function setStatus(text, cls) {
          status.textContent = text;
          status.className = cls || '';
        }

        function showDescription() {
          descEl.classList.remove('hidden');
        }

        async function submit() {
          if (!parseText) return;
          const parsed = parseText(currentRaw());
          if (!parsed.title) return;
          // If the user typed a `!token` that didn't resolve, fail loud
          // rather than silently dropping the marker and posting to Inbox.
          let projectId;
          if (parsed.projectMarker) {
            const project = resolveProject(parsed.projectMarker);
            if (!project) {
              setStatus('No project matches "!' + parsed.projectMarker + '"', 'error');
              return;
            }
            projectId = project.id;
          }
          setStatus('Saving…', 'saving');
          const body = { title: parsed.title };
          if (projectId) body.projectId = projectId;
          // Stash the raw parse on the request so the Angular side can
          // reuse extras (assignees, milestone, date, priority, status,
          // description) without re-parsing. This is a hint the local REST
          // API is free to ignore — the effect re-parses `task.title`
          // as its authoritative source (see #19 rationale).
          if (parsed.rawTitle) {
            body._quickAddRaw = currentRaw();
          }
          try {
            const res = await fetch(REST + '/tasks', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            if (!res.ok) {
              const errBody = await res.text();
              setStatus('Save failed (' + res.status + '): ' + errBody, 'error');
              return;
            }
            titleEl.value = '';
            descEl.value = '';
            descEl.classList.add('hidden');
            updatePreview();
            setStatus('Saved.', '');
            setTimeout(() => {
              window.close();
            }, 350);
          } catch (err) {
            setStatus('Save error: ' + (err && err.message ? err.message : err), 'error');
          }
        }

        // Title input handlers: keep the field single-line by intercepting
        // Enter. Shift+Enter and ArrowDown both open the description drawer
        // and move focus — either gesture feels natural (Shift+Enter matches
        // Slack/Discord/GitHub; ArrowDown matches Alfred/Raycast panel nav).
        titleEl.addEventListener('input', updatePreview);
        titleEl.addEventListener('keydown', (ev) => {
          if (ev.key === 'Escape') {
            ev.preventDefault();
            window.close();
            return;
          }
          if (ev.key === 'Enter' && !ev.isComposing) {
            ev.preventDefault();
            if (ev.shiftKey) {
              showDescription();
              descEl.focus();
              return;
            }
            submit();
          } else if (ev.key === 'ArrowDown' && !ev.shiftKey && !ev.metaKey) {
            ev.preventDefault();
            showDescription();
            descEl.focus();
          }
        });

        descEl.addEventListener('input', updatePreview);
        descEl.addEventListener('keydown', (ev) => {
          if (ev.key === 'Escape') {
            ev.preventDefault();
            window.close();
            return;
          }
          // Cmd/Ctrl+Enter submits from the description drawer — plain Enter
          // in a textarea should insert a newline (matches every other multi-
          // line input in the app; Slack/Discord follow the same convention).
          if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey) && !ev.isComposing) {
            ev.preventDefault();
            submit();
          } else if (
            ev.key === 'ArrowUp' &&
            !ev.shiftKey &&
            !ev.metaKey &&
            descEl.selectionStart === 0
          ) {
            // At the top of the description, ArrowUp jumps focus back to
            // the title. Cursor at start ensures we only steal focus when
            // the user is trying to leave the drawer, not when they're
            // editing within it.
            ev.preventDefault();
            titleEl.focus();
          }
        });

        window.addEventListener('focus', () => titleEl.focus());
        titleEl.focus();
        loadProjects();
      })();
    </script>
  </body>
</html>
