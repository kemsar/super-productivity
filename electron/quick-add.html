<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      `script-src 'self' 'unsafe-inline'` — `'self'` lets us pull the
      shared parser out of `./shared-with-frontend/` as a plain `<script src>`,
      `'unsafe-inline'` covers the overlay's own logic. Not swapping to
      `type="module"` on purpose: Electron file:// origins block ES-module
      imports on CORS, and a UMD-shaped parser (see quick-add-parser.js)
      dodges the problem without a preload or bundler in the loop.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src http://127.0.0.1:3876"
    />
    <title>Quick Add</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1e1e1e;
        --fg: #f5f5f5;
        --fg-muted: #999;
        --border: #333;
        --accent: #4f8dff;
        --error: #ff5252;
        --warn: #ffb347;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 20px;
        box-sizing: border-box;
      }
      .hint {
        font-size: 12px;
        color: var(--fg-muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 10px;
      }
      /* Title line — a single-line textarea (rows=1) so Enter can carry the
         "submit" semantic while Shift+Enter (or a downward-arrow keystroke)
         drops into the description drawer. `resize:none` and a hard-coded
         height keep the overlay's chrome stable. */
      #title {
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        color: var(--fg);
        font-size: 22px;
        line-height: 1.3;
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
        resize: none;
        font-family: inherit;
        overflow: hidden;
        height: 34px;
      }
      #title:focus {
        border-bottom-color: var(--accent);
      }
      /* Description drawer — hidden until the user pushes Enter-with-Shift
         or the down-arrow. Grows organically via JS autosize (see the
         inline script's `autosize` helper); capped at ~7 lines then
         scrolls. Muted styling keeps it visually secondary to the title. */
      #description {
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        color: var(--fg-muted);
        font-size: 14px;
        line-height: 1.4;
        padding: 8px 0 0;
        resize: none;
        font-family: inherit;
        /* Two-line minimum so the drawer feels substantial when opened —
           the previous 24px min made it look like a search field, not a
           note. `max-height` caps growth; JS autosize handles the middle. */
        min-height: 44px;
        max-height: 150px;
        overflow-y: auto;
      }
      #description.hidden {
        display: none;
      }
      #description::placeholder {
        color: var(--fg-muted);
        opacity: 0.6;
      }
      #status {
        margin-top: 12px;
        font-size: 13px;
        min-height: 18px;
        color: var(--fg-muted);
      }
      #status.error {
        color: var(--error);
      }
      #status.saving {
        color: var(--accent);
      }
      /* Project autocomplete dropdown — appears while the caret is inside
         a !<token> region. Positioned absolutely below the title textarea
         so it doesn't push other UI around when opened. Highlighted item
         gets the accent-tinted background; keyboard nav + click both
         select. Capped at a scroll-y list so a large project list stays
         usable. */
      .autocomplete {
        position: absolute;
        top: 74px;
        left: 20px;
        right: 20px;
        max-height: 180px;
        overflow-y: auto;
        background: #262626;
        border: 1px solid var(--border);
        border-radius: 4px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        z-index: 10;
      }
      .autocomplete.hidden {
        display: none;
      }
      .autocomplete .row {
        padding: 6px 12px;
        font-size: 13px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .autocomplete .row .hint-key {
        color: var(--fg-muted);
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 11px;
      }
      .autocomplete .row.active,
      .autocomplete .row:hover {
        background: rgba(79, 141, 255, 0.18);
        color: var(--accent);
      }
      .autocomplete .empty {
        padding: 8px 12px;
        font-size: 12px;
        color: var(--fg-muted);
        font-style: italic;
      }
      /* Non-blocking "you may already have this" hint: existing tasks whose
         title matches what's being typed. Purely informational — clicking a
         row focuses that task in the main window; Enter still creates a new
         task as usual. */
      .match-hint {
        margin-top: 8px;
        border-left: 2px solid var(--accent);
        padding-left: 8px;
      }
      .match-hint.hidden {
        display: none;
      }
      .match-hint .match-label {
        font-size: 11px;
        color: var(--fg-muted);
        margin-bottom: 2px;
      }
      .match-hint .match-row {
        padding: 4px 6px;
        font-size: 13px;
        cursor: pointer;
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: baseline;
      }
      .match-hint .match-row:hover {
        background: rgba(79, 141, 255, 0.18);
        color: var(--accent);
      }
      .match-hint .match-row .match-ref {
        color: var(--fg-muted);
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 11px;
        white-space: nowrap;
      }
      /* Live-parsed preview — a strip of chips populated by the parser.
         Each chip labels the token kind and shows the resolved value (or an
         unresolved warning). The whole strip hides when there's nothing to
         show, so a plain "walk the dog" title has zero decoration. */
      .parse-preview {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 12px;
        min-height: 22px;
      }
      .parse-preview .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: rgba(79, 141, 255, 0.15);
        color: var(--accent);
        border-radius: 3px;
        padding: 2px 8px;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 11px;
        line-height: 1.4;
      }
      .parse-preview .chip .k {
        color: var(--fg-muted);
      }
      .parse-preview .chip.warn {
        background: rgba(255, 179, 71, 0.15);
        color: var(--warn);
      }
      .parse-preview .chip.error {
        background: rgba(255, 82, 82, 0.15);
        color: var(--error);
      }
      /* Save affordance for the description drawer — a plain textarea gives
         no way to submit (Enter inserts a newline), so once the drawer is
         open we surface an explicit Save button alongside the ⌘↵ shortcut. */
      .desc-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 6px;
      }
      .desc-actions.hidden {
        display: none;
      }
      .desc-actions button {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        background: rgba(79, 141, 255, 0.15);
        color: var(--accent);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .desc-actions button:hover {
        background: rgba(79, 141, 255, 0.28);
      }
      .keys {
        margin-top: auto;
        display: flex;
        gap: 16px;
        font-size: 11px;
        color: var(--fg-muted);
        flex-wrap: wrap;
      }
      kbd {
        background: #2a2a2a;
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 2px 6px;
        font-family: inherit;
        font-size: 10px;
        margin-right: 4px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="hint">Quick add task</div>
      <textarea
        id="title"
        rows="1"
        autofocus
        placeholder="What's on your mind?"
        autocomplete="off"
        spellcheck="false"
        aria-label="Task title with optional !project @user #label ##milestone ~date !!priority >status tokens"
      ></textarea>
      <textarea
        id="description"
        class="hidden"
        rows="1"
        placeholder="Description (optional)"
        autocomplete="off"
        spellcheck="false"
        aria-label="Task description"
      ></textarea>
      <div
        id="desc-actions"
        class="desc-actions hidden"
      >
        <button
          type="button"
          id="desc-save"
        >
          Save <kbd>⌘↵</kbd>
        </button>
      </div>
      <div
        id="project-autocomplete"
        class="autocomplete hidden"
        role="listbox"
        aria-label="Project suggestions"
      ></div>
      <div
        id="parse-preview"
        class="parse-preview"
      ></div>
      <div
        id="match-hint"
        class="match-hint hidden"
        aria-label="Existing tasks that match"
      ></div>
      <div id="status"></div>
      <div class="keys">
        <span><kbd>Enter</kbd>save</span>
        <span><kbd>Shift+Enter</kbd>description</span>
        <span
          ><kbd>!prj</kbd> <kbd>@who</kbd> <kbd>#tag</kbd> <kbd>##ms</kbd>
          <kbd>~date</kbd> <kbd>!!pri</kbd> <kbd>&gt;stat</kbd></span
        >
        <span><kbd>Esc</kbd>cancel</span>
      </div>
    </div>
    <!--
      Load the shared parser via plain <script src>. See the CSP comment
      above for why we're NOT using type="module" here. `SPQuickAddParser`
      lands as a global containing `parseQuickAddText` / `resolveDateToken`.
    -->
    <script src="./shared-with-frontend/quick-add-parser.js"></script>
    <script>
      // Self-contained overlay logic. Talks to SP via the local REST API on
      // 127.0.0.1:3876 (GET /projects, POST /tasks). Grammar/parsing lives
      // in shared-with-frontend/quick-add-parser.js so the Angular effect
      // can re-parse from the same source (issue #19).
      (function () {
        const REST = 'http://127.0.0.1:3876';
        // The local REST API requires a bearer token on every request (#9155).
        // The main process injects it via this window's query string; attach it
        // to every REST fetch so the dropdowns + task-create authenticate.
        const REST_TOKEN = new URLSearchParams(location.search).get('token') || '';
        const _origFetch = window.fetch.bind(window);
        window.fetch = (url, opts) => {
          const o = opts || {};
          if (REST_TOKEN && String(url).indexOf(REST) === 0) {
            const headers = new Headers(o.headers || {});
            headers.set('Authorization', 'Bearer ' + REST_TOKEN);
            return _origFetch(url, { ...o, headers });
          }
          return _origFetch(url, o);
        };
        const titleEl = document.getElementById('title');
        const descEl = document.getElementById('description');
        const descActions = document.getElementById('desc-actions');
        const descSave = document.getElementById('desc-save');
        const status = document.getElementById('status');
        const preview = document.getElementById('parse-preview');
        const matchHint = document.getElementById('match-hint');
        const autocompleteEl = document.getElementById('project-autocomplete');
        const parseText = window.SPQuickAddParser
          ? window.SPQuickAddParser.parseQuickAddText
          : null;

        // Autocomplete state — populated as the user types inside a token
        // region (!project, @user, ##milestone, !!priority, >status). All
        // token kinds share the same DOM + keyboard nav; only the match
        // sources differ. `kind` distinguishes them for rendering and
        // insertion. `matches` is the list of options, each shape depends
        // on kind but every entry has a `.label` string used to render.
        const acState = {
          open: false,
          kind: null,
          matches: [],
          activeIndex: 0,
          tokenRange: null,
          // Debounce ticket for async fetches (users, milestones). Each
          // input bumps the counter; only the latest response wins so a
          // slow response for `!ke` can't replace a faster one for `!kev`.
          reqSeq: 0,
        };

        // Static vocabularies for the tokens that don't need a GitLab
        // round-trip. Mirrors the parser's canonicalization exactly so
        // picking one always resolves cleanly.
        const PRIORITY_OPTIONS = [
          { value: 'low', label: 'Low' },
          { value: 'medium', label: 'Medium' },
          { value: 'high', label: 'High' },
          { value: 'urgent', label: 'Urgent' },
        ];
        const STATUS_OPTIONS = [
          { value: 'open', label: 'Open (default)' },
          { value: 'closed', label: 'Closed' },
          { value: 'done', label: 'Done' },
        ];

        // GitLab lookup cache. Keyed by SP project id → the provider + path
        // that syncs it. Populated the first time we detect an @-token or
        // ##-token in the input while a project is resolved. Miss = null
        // (no GitLab provider for this SP project; drop those dropdowns).
        const gitlabProviderCache = new Map();
        // Milestone list, keyed by "providerId::gitlabPath". Fetched once
        // per (provider, project) pair, then filtered client-side.
        const milestoneCache = new Map();
        // Debounced /users?search=X results. Small in-memory LRU-ish
        // (query → array). Ignored when the query changes underneath.
        const userSearchCache = new Map();
        // Label list + custom Status options, both keyed by
        // "providerId::spProjectId" and filtered client-side by prefix.
        const labelCache = new Map();
        const statusCache = new Map();

        if (!parseText) {
          // Parser failed to load — the overlay is unusable. Fail loud so
          // devtools shows the reason rather than pretending to work with a
          // degraded (project-marker-only) grammar the user won't notice.
          status.textContent = 'Parser failed to load — check devtools.';
          status.className = 'error';
        }

        // Projects, loaded once on open. Small enough to cache in memory;
        // token/title comparisons stay case-insensitive so `!odin-pipes`
        // matches "ODIN Pipes" without hyphen-vs-space bikeshedding.
        let projects = [];

        async function loadProjects() {
          try {
            const res = await fetch(REST + '/projects');
            if (!res.ok) return;
            const body = await res.json();
            projects = Array.isArray(body) ? body : body.data || [];
          } catch (err) {
            console.warn('[quick-add] failed to load projects', err);
          }
        }

        function normalize(s) {
          return String(s || '')
            .toLowerCase()
            .replace(/[^a-z0-9]/g, '');
        }

        function resolveProject(token) {
          if (!token) return null;
          const needle = normalize(token);
          if (!needle) return null;
          const exact = projects.find((p) => normalize(p.title) === needle);
          if (exact) return exact;
          const prefixMatches = projects.filter((p) =>
            normalize(p.title).startsWith(needle),
          );
          return prefixMatches.length === 1 ? prefixMatches[0] : null;
        }

        function listProjectMatches(token) {
          const needle = normalize(token);
          if (!needle) return projects.slice();
          return projects.filter((p) => normalize(p.title).startsWith(needle));
        }

        // Every token kind's marker + its length in characters. Order
        // matters — longer markers (##, !!) must be tried before their
        // shorter prefixes (#, !).
        const TOKEN_MARKERS = [
          { kind: 'milestone', marker: '##' },
          { kind: 'label', marker: '#' },
          { kind: 'priority', marker: '!!' },
          { kind: 'project', marker: '!' },
          { kind: 'assignee', marker: '@' },
          { kind: 'status', marker: '>' },
        ];

        // Detects whether the caret is currently inside any token region
        // in the title textarea. Returns { kind, marker, start, end, value }
        // if so — where `start` points at the FIRST char of the marker,
        // `end` is one past the token's last non-whitespace char, and
        // `value` is the token text after the marker. Returns null when
        // the caret isn't in a token.
        //
        // The marker must be at position 0 OR immediately after whitespace,
        // so mid-word occurrences (email-style `foo@bar`) don't trigger.
        function findTokenAtCaret() {
          const raw = titleEl.value;
          const caret = titleEl.selectionStart;
          if (caret == null) return null;
          // Scan backwards to the start of the current whitespace-delimited
          // word. That's where any marker would have to live.
          let start = caret - 1;
          while (start >= 0 && !/\s/.test(raw[start])) {
            start--;
          }
          start++;
          if (start >= raw.length) return null;
          // Match the longest marker present at `start`. The TOKEN_MARKERS
          // array is ordered so `##` and `!!` win over `#` and `!`.
          const hit = TOKEN_MARKERS.find((m) => raw.startsWith(m.marker, start));
          if (!hit) return null;
          // Extend forward until whitespace or EOL.
          let end = caret;
          while (end < raw.length && !/\s/.test(raw[end])) {
            end++;
          }
          return {
            kind: hit.kind,
            marker: hit.marker,
            start,
            end,
            value: raw.slice(start + hit.marker.length, end),
          };
        }

        function renderAutocomplete() {
          if (!acState.open || acState.matches.length === 0) {
            autocompleteEl.classList.add('hidden');
            autocompleteEl.innerHTML = '';
            return;
          }
          autocompleteEl.classList.remove('hidden');
          autocompleteEl.innerHTML = '';
          acState.matches.forEach((match, i) => {
            const row = document.createElement('div');
            row.className = 'row' + (i === acState.activeIndex ? ' active' : '');
            row.setAttribute('role', 'option');
            row.setAttribute(
              'aria-selected',
              i === acState.activeIndex ? 'true' : 'false',
            );
            // Every match must expose a `label` for display. Kind-specific
            // secondary text (e.g. milestone state, user @username) shows
            // to the right when present.
            const hint =
              i === acState.activeIndex ? '<span class="hint-key">↵/Tab</span>' : '';
            const sub = match.subLabel
              ? '<span class="hint-key">' + escapeHtml(match.subLabel) + '</span>'
              : '';
            row.innerHTML =
              '<span>' + escapeHtml(match.label) + '</span>' + (sub || hint);
            row.addEventListener('mousedown', (ev) => {
              // mousedown (not click) so the textarea keeps focus — the
              // click event would fire AFTER a blur that we don't want.
              ev.preventDefault();
              pickAutocomplete(i);
            });
            autocompleteEl.appendChild(row);
          });
        }

        function closeAutocomplete() {
          acState.open = false;
          acState.kind = null;
          acState.matches = [];
          acState.tokenRange = null;
          renderAutocomplete();
        }

        // Dispatch table by kind — each returns the {matches, isAsync}
        // shape the autocomplete UI expects. Async kinds (assignee,
        // milestone) additionally kick off a fetch and update again once
        // it lands, so the dropdown fills in from the current state right
        // now (usually empty) and repopulates when the response arrives.
        async function fetchMatchesForKind(kind, value) {
          if (kind === 'project') {
            return listProjectMatches(value).map((p) => ({
              value: p,
              label: p.title,
              insert: '!' + String(p.title).replace(/\s+/g, '-'),
            }));
          }
          if (kind === 'priority') {
            const needle = value.toLowerCase();
            return PRIORITY_OPTIONS.filter((o) => o.value.startsWith(needle)).map(
              (o) => ({ value: o, label: o.label, insert: '!!' + o.value }),
            );
          }
          if (kind === 'status') {
            return fetchStatusMatches(value);
          }
          if (kind === 'assignee') {
            return fetchAssigneeMatches(value);
          }
          if (kind === 'milestone') {
            return fetchMilestoneMatches(value);
          }
          if (kind === 'label') {
            return fetchLabelMatches(value);
          }
          return [];
        }

        // Resolves the currently-typed !project to its {providerId,
        // gitlabPath} so we know which provider to query for @ / ## data.
        // Caches per-SP-project so switching projects re-resolves; null if
        // no GitLab provider maps the current SP project (in which case
        // @/## dropdowns just show empty).
        async function resolveGitlabProvider() {
          const parsed = parseText ? parseText(currentRaw()) : null;
          const project = parsed?.projectMarker
            ? resolveProject(parsed.projectMarker)
            : null;
          const spProjectId = project?.id;
          if (!spProjectId) return null;
          if (gitlabProviderCache.has(spProjectId)) {
            return gitlabProviderCache.get(spProjectId);
          }
          try {
            const url =
              REST +
              '/gitlab/provider-for-project?spProjectId=' +
              encodeURIComponent(spProjectId);
            const res = await fetch(url);
            if (!res.ok) {
              gitlabProviderCache.set(spProjectId, null);
              return null;
            }
            const body = await res.json();
            const provider = body?.data?.provider || null;
            gitlabProviderCache.set(spProjectId, provider);
            return provider;
          } catch (err) {
            console.warn('[quick-add] provider-for-project failed', err);
            gitlabProviderCache.set(spProjectId, null);
            return null;
          }
        }

        async function fetchAssigneeMatches(value) {
          const provider = await resolveGitlabProvider();
          if (!provider) return [];
          const search = value.trim();
          if (!search) return [];
          if (userSearchCache.has(search)) {
            return userSearchCache.get(search);
          }
          try {
            const url =
              REST +
              '/gitlab/users?providerId=' +
              encodeURIComponent(provider.id) +
              '&search=' +
              encodeURIComponent(search);
            const res = await fetch(url);
            if (!res.ok) return [];
            const body = await res.json();
            const users = Array.isArray(body?.data) ? body.data : [];
            const mapped = users.map((u) => ({
              value: u,
              label: u.name ? u.name + ' (@' + u.username + ')' : '@' + u.username,
              subLabel: '@' + u.username,
              insert: '@' + u.username,
            }));
            userSearchCache.set(search, mapped);
            return mapped;
          } catch (err) {
            console.warn('[quick-add] user search failed', err);
            return [];
          }
        }

        async function fetchMilestoneMatches(value) {
          const provider = await resolveGitlabProvider();
          if (!provider) return [];
          const parsed = parseText ? parseText(currentRaw()) : null;
          const project = parsed?.projectMarker
            ? resolveProject(parsed.projectMarker)
            : null;
          if (!project?.id) return [];
          const cacheKey = provider.id + '::' + project.id;
          let list = milestoneCache.get(cacheKey);
          if (!list) {
            try {
              const url =
                REST +
                '/gitlab/milestones?providerId=' +
                encodeURIComponent(provider.id) +
                '&spProjectId=' +
                encodeURIComponent(project.id);
              const res = await fetch(url);
              if (!res.ok) return [];
              const body = await res.json();
              list = Array.isArray(body?.data) ? body.data : [];
              milestoneCache.set(cacheKey, list);
            } catch (err) {
              console.warn('[quick-add] milestone list failed', err);
              return [];
            }
          }
          const needle = normalize(value);
          const filtered = needle
            ? list.filter((m) => normalize(m.title).startsWith(needle))
            : list;
          return filtered.map((m) => ({
            value: m,
            label: m.title,
            subLabel: m.state === 'closed' ? 'closed' : '',
            insert: '##' + String(m.title).replace(/\s+/g, '-'),
          }));
        }

        // Resolves the {providerId, spProjectId} pair the async #-label and
        // >-status dropdowns key their per-project caches on. Returns null
        // when there's no resolved GitLab provider or !project yet.
        async function resolveProviderProject() {
          const provider = await resolveGitlabProvider();
          if (!provider) return null;
          const parsed = parseText ? parseText(currentRaw()) : null;
          const project = parsed?.projectMarker
            ? resolveProject(parsed.projectMarker)
            : null;
          if (!project?.id) return null;
          return { provider, project };
        }

        async function fetchLabelMatches(value) {
          const ctx = await resolveProviderProject();
          if (!ctx) return [];
          const cacheKey = ctx.provider.id + '::' + ctx.project.id;
          let list = labelCache.get(cacheKey);
          if (!list) {
            try {
              const url =
                REST +
                '/gitlab/labels?providerId=' +
                encodeURIComponent(ctx.provider.id) +
                '&spProjectId=' +
                encodeURIComponent(ctx.project.id);
              const res = await fetch(url);
              if (!res.ok) return [];
              const body = await res.json();
              list = Array.isArray(body?.data) ? body.data : [];
              labelCache.set(cacheKey, list);
            } catch (err) {
              console.warn('[quick-add] label list failed', err);
              return [];
            }
          }
          const needle = normalize(value);
          const filtered = needle
            ? list.filter((l) => normalize(l.name).startsWith(needle))
            : list;
          return filtered.map((l) => ({
            value: l,
            label: l.name,
            insert: '#' + String(l.name).replace(/\s+/g, '-'),
          }));
        }

        // Fetches the project's custom work-item Status options (the
        // configurable lifecycle statuses). Empty when the instance doesn't
        // expose the widget — callers then fall back to STATUS_OPTIONS.
        async function fetchCustomStatuses() {
          const ctx = await resolveProviderProject();
          if (!ctx) return [];
          const cacheKey = ctx.provider.id + '::' + ctx.project.id;
          let list = statusCache.get(cacheKey);
          if (!list) {
            try {
              const url =
                REST +
                '/gitlab/statuses?providerId=' +
                encodeURIComponent(ctx.provider.id) +
                '&spProjectId=' +
                encodeURIComponent(ctx.project.id);
              const res = await fetch(url);
              if (!res.ok) return [];
              const body = await res.json();
              list = Array.isArray(body?.data) ? body.data : [];
              statusCache.set(cacheKey, list);
            } catch (err) {
              console.warn('[quick-add] status list failed', err);
              return [];
            }
          }
          return list;
        }

        async function fetchStatusMatches(value) {
          const custom = await fetchCustomStatuses();
          if (custom.length) {
            const needle = normalize(value);
            const filtered = needle
              ? custom.filter((s) => normalize(s.name).startsWith(needle))
              : custom;
            return filtered.map((s) => ({
              value: s,
              label: s.name,
              insert: '>' + String(s.name).replace(/\s+/g, '-'),
            }));
          }
          // Fallback: the universal issue state (open/closed/done) for
          // instances without the custom Status widget.
          const lower = value.toLowerCase();
          return STATUS_OPTIONS.filter((o) => o.value.startsWith(lower)).map((o) => ({
            value: o,
            label: o.label,
            insert: '>' + o.value,
          }));
        }

        // Refresh acState from the caret position + input. Called on every
        // input event and after picks. When the caret leaves any token
        // region, the dropdown closes.
        async function updateAutocomplete() {
          const token = findTokenAtCaret();
          if (!token) {
            closeAutocomplete();
            return;
          }
          const seq = ++acState.reqSeq;
          const matches = await fetchMatchesForKind(token.kind, token.value);
          // Ignore stale responses — the token may have changed under us
          // (user kept typing) between the fetch and this landing.
          if (seq !== acState.reqSeq) return;
          acState.open = matches.length > 0;
          acState.kind = token.kind;
          acState.matches = matches;
          acState.tokenRange = { start: token.start, end: token.end };
          if (acState.activeIndex >= acState.matches.length) {
            acState.activeIndex = 0;
          }
          renderAutocomplete();
        }

        // Replaces the token region with the chosen match's `insert`
        // string plus a trailing space, and moves the caret to right
        // after the space so the next token can be typed immediately.
        // Every match provides its own `insert` — the kind-specific
        // fetcher is responsible for hyphenating multi-word values so the
        // grammar's whitespace-terminated token boundary still applies.
        function pickAutocomplete(index) {
          if (!acState.tokenRange || !acState.matches[index]) return;
          const match = acState.matches[index];
          const insert = match.insert + ' ';
          const raw = titleEl.value;
          const { start, end } = acState.tokenRange;
          const before = raw.slice(0, start);
          const after = raw.slice(end);
          titleEl.value = before + insert + after;
          const newCaret = before.length + insert.length;
          titleEl.setSelectionRange(newCaret, newCaret);
          closeAutocomplete();
          updatePreview();
        }

        function escapeHtml(s) {
          return String(s).replace(/[&<>"']/g, (c) => {
            switch (c) {
              case '&':
                return '&amp;';
              case '<':
                return '&lt;';
              case '>':
                return '&gt;';
              case '"':
                return '&quot;';
              default:
                return '&#39;';
            }
          });
        }

        function chip(kind, value, cls) {
          const c = document.createElement('span');
          c.className = 'chip' + (cls ? ' ' + cls : '');
          c.innerHTML =
            '<span class="k">' + escapeHtml(kind) + '</span>' + escapeHtml(value);
          return c;
        }

        // Build the raw input the parser expects. Line 1 is the title
        // textarea's content; line 2+ is the description drawer if it has
        // any text. Keeping the textareas separate on-screen but joining
        // them at parse time lets the parser stay a single-string function.
        function currentRaw() {
          const t = titleEl.value;
          const d = descEl.value;
          return d.length ? t + '\n' + d : t;
        }

        function appendProjectChip(parsed) {
          if (!parsed.projectMarker) return;
          const project = resolveProject(parsed.projectMarker);
          preview.appendChild(
            project
              ? chip('project', project.title)
              : chip('project', '!' + parsed.projectMarker + ' (no match)', 'error'),
          );
        }

        function updatePreview() {
          if (!parseText) return;
          preview.innerHTML = '';
          const parsed = parseText(currentRaw());

          appendProjectChip(parsed);
          for (const a of parsed.assignees) {
            preview.appendChild(chip('assign', '@' + a));
          }
          for (const l of parsed.labels) {
            preview.appendChild(chip('label', '#' + l));
          }
          if (parsed.milestone) {
            preview.appendChild(chip('milestone', parsed.milestone));
          }
          if (parsed.dueDate) {
            preview.appendChild(chip('due', parsed.dueDate));
          } else if (parsed.dueDateRaw) {
            preview.appendChild(chip('due', '~' + parsed.dueDateRaw + ' (?)', 'warn'));
          }
          if (parsed.priority) {
            preview.appendChild(chip('priority', parsed.priority));
          } else if (parsed.priorityRaw) {
            preview.appendChild(
              chip('priority', '!!' + parsed.priorityRaw + ' (?)', 'warn'),
            );
          }
          if (parsed.status) {
            preview.appendChild(chip('status', parsed.status));
          }
          if (parsed.description) {
            const len = parsed.description.length;
            preview.appendChild(chip('desc', len + (len === 1 ? ' char' : ' chars')));
          }
        }

        // --- "similar existing tasks" hint --------------------------------
        // Debounced search over existing SP tasks by the clean (token-stripped)
        // title, surfaced as a passive, non-blocking hint so you notice a
        // duplicate before creating one. Clicking a match focuses that task in
        // the main window and dismisses the overlay; Enter still creates a new
        // task as usual.
        const matchCache = new Map();
        let matchTimer = null;
        let matchTicket = 0;

        function hideMatchHint() {
          matchHint.classList.add('hidden');
          matchHint.innerHTML = '';
        }

        function issueRef(task) {
          if (!task.issueId) return '';
          const id = String(task.issueId);
          const iid = id.includes('#') ? '#' + id.split('#').pop() : id;
          return (task.issueType ? task.issueType + ' ' : '') + iid;
        }

        function renderMatchHint(tasks) {
          if (!tasks || !tasks.length) {
            hideMatchHint();
            return;
          }
          matchHint.innerHTML = '';
          const label = document.createElement('div');
          label.className = 'match-label';
          label.textContent =
            (tasks.length === 1
              ? '1 existing task matches'
              : tasks.length + ' existing tasks match') + ' — click to open';
          matchHint.appendChild(label);
          for (const t of tasks) {
            const row = document.createElement('div');
            row.className = 'match-row';
            const title = document.createElement('span');
            title.className = 'match-title';
            title.textContent = t.title;
            row.appendChild(title);
            const ref = issueRef(t);
            if (ref) {
              const refEl = document.createElement('span');
              refEl.className = 'match-ref';
              refEl.textContent = ref;
              row.appendChild(refEl);
            }
            row.addEventListener('click', () => focusExistingTask(t.id));
            matchHint.appendChild(row);
          }
          matchHint.classList.remove('hidden');
        }

        async function focusExistingTask(taskId) {
          try {
            const res = await fetch(REST + '/task-control/focus', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ taskId }),
            });
            if (!res.ok) {
              setStatus('Could not open task (' + res.status + ')', 'error');
              return;
            }
            window.close();
          } catch (err) {
            setStatus('Open error: ' + (err && err.message ? err.message : err), 'error');
          }
        }

        function updateMatchHint() {
          // Token dropdown takes precedence; never stack a hint under it.
          if (!parseText || acState.open) {
            hideMatchHint();
            return;
          }
          const title = (parseText(currentRaw()).title || '').trim();
          if (title.length < 3) {
            hideMatchHint();
            return;
          }
          clearTimeout(matchTimer);
          matchTimer = setTimeout(async () => {
            const ticket = ++matchTicket;
            const key = title.toLowerCase();
            let tasks = matchCache.get(key);
            if (!tasks) {
              try {
                const res = await fetch(
                  REST + '/tasks?query=' + encodeURIComponent(title),
                );
                if (!res.ok) {
                  hideMatchHint();
                  return;
                }
                tasks = await res.json();
                matchCache.set(key, tasks);
              } catch {
                hideMatchHint();
                return;
              }
            }
            // Bail if a newer keystroke superseded this, or a token dropdown
            // opened while the fetch was in flight.
            if (ticket !== matchTicket || acState.open) return;
            renderMatchHint(Array.isArray(tasks) ? tasks.slice(0, 4) : []);
          }, 250);
        }

        function setStatus(text, cls) {
          status.textContent = text;
          status.className = cls || '';
        }

        function showDescription() {
          descEl.classList.remove('hidden');
          descActions.classList.remove('hidden');
          autosizeDescription();
        }

        // Autosize the description textarea: reset height to auto so the
        // browser recomputes scrollHeight from content (otherwise it stays
        // at the previous computed height and never shrinks), then set the
        // height to match. The CSS max-height caps growth; overflow-y kicks
        // in at that point.
        function autosizeDescription() {
          if (descEl.classList.contains('hidden')) return;
          descEl.style.height = 'auto';
          descEl.style.height = descEl.scrollHeight + 'px';
        }

        async function submit() {
          if (!parseText) return;
          const parsed = parseText(currentRaw());
          if (!parsed.title) return;
          // If the user typed a `!token` that didn't resolve, fail loud
          // rather than silently dropping the marker and posting to Inbox.
          let projectId;
          if (parsed.projectMarker) {
            const project = resolveProject(parsed.projectMarker);
            if (!project) {
              setStatus('No project matches "!' + parsed.projectMarker + '"', 'error');
              return;
            }
            projectId = project.id;
          }
          setStatus('Saving…', 'saving');
          // Send the RAW title (tokens included) so the auto-create effect
          // can re-parse it as the single source of truth for BOTH overlay
          // and in-app quick-add entries. `notes` carries the description
          // directly — SP's task-notes field is exactly the concept the
          // overlay's description drawer captures. The SP task briefly
          // shows the raw tokens between add-task and retro-link (~1s),
          // then the retro-link replaces the title with `#N <clean>` and
          // sets task.dueDay from the ~date token (issue #19).
          const body = { title: parsed.rawTitle };
          if (projectId) body.projectId = projectId;
          if (parsed.description) body.notes = parsed.description;
          try {
            const res = await fetch(REST + '/tasks', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            if (!res.ok) {
              const errBody = await res.text();
              setStatus('Save failed (' + res.status + '): ' + errBody, 'error');
              return;
            }
            titleEl.value = '';
            descEl.value = '';
            descEl.classList.add('hidden');
            descActions.classList.add('hidden');
            descEl.style.height = ''; // clear inline height so next open starts at CSS min
            updatePreview();
            hideMatchHint();
            setStatus('Saved.', '');
            setTimeout(() => {
              window.close();
            }, 350);
          } catch (err) {
            setStatus('Save error: ' + (err && err.message ? err.message : err), 'error');
          }
        }

        // Title input handlers: keep the field single-line by intercepting
        // Enter. Shift+Enter and ArrowDown both open the description drawer
        // and move focus — either gesture feels natural (Shift+Enter matches
        // Slack/Discord/GitHub; ArrowDown matches Alfred/Raycast panel nav).
        //
        // When the project-autocomplete dropdown is open, ArrowUp/Down
        // navigate it, Enter/Tab pick, Esc closes the dropdown (does NOT
        // cancel the window). Any other input closes the dropdown by
        // falling through to updateAutocomplete on 'input' below.
        titleEl.addEventListener('input', () => {
          updateAutocomplete();
          updatePreview();
          // After updateAutocomplete so acState.open reflects the current token.
          updateMatchHint();
        });
        // Selection changes (arrow-key movement without typing) also need
        // to update autocomplete visibility — moving out of the token
        // region should close the dropdown.
        titleEl.addEventListener('click', updateAutocomplete);
        titleEl.addEventListener('keyup', (ev) => {
          if (ev.key.startsWith('Arrow') || ev.key === 'Home' || ev.key === 'End') {
            updateAutocomplete();
          }
        });
        // Handles arrow-nav / pick / dismiss for the project-autocomplete
        // dropdown. Returns true if the event was consumed (caller should
        // not fall through to the default title-textarea handling).
        function handleAutocompleteKey(ev) {
          if (!acState.open) return false;
          if (ev.shiftKey || ev.metaKey) return false;
          if (ev.key === 'ArrowDown') {
            ev.preventDefault();
            acState.activeIndex = (acState.activeIndex + 1) % acState.matches.length;
            renderAutocomplete();
            return true;
          }
          if (ev.key === 'ArrowUp') {
            ev.preventDefault();
            acState.activeIndex =
              (acState.activeIndex - 1 + acState.matches.length) % acState.matches.length;
            renderAutocomplete();
            return true;
          }
          if ((ev.key === 'Enter' || ev.key === 'Tab') && !ev.isComposing) {
            ev.preventDefault();
            pickAutocomplete(acState.activeIndex);
            return true;
          }
          if (ev.key === 'Escape') {
            // Close the dropdown, but leave the window open — Esc-to-cancel
            // requires a second press when the dropdown was open.
            ev.preventDefault();
            closeAutocomplete();
            return true;
          }
          return false;
        }

        titleEl.addEventListener('keydown', (ev) => {
          if (handleAutocompleteKey(ev)) return;
          if (ev.key === 'Escape') {
            ev.preventDefault();
            window.close();
            return;
          }
          if (ev.key === 'Enter' && !ev.isComposing) {
            ev.preventDefault();
            if (ev.shiftKey) {
              showDescription();
              descEl.focus();
              return;
            }
            submit();
          } else if (ev.key === 'ArrowDown' && !ev.shiftKey && !ev.metaKey) {
            ev.preventDefault();
            showDescription();
            descEl.focus();
          }
        });

        descEl.addEventListener('input', () => {
          autosizeDescription();
          updatePreview();
        });
        descEl.addEventListener('keydown', (ev) => {
          if (ev.key === 'Escape') {
            ev.preventDefault();
            window.close();
            return;
          }
          // Cmd/Ctrl+Enter submits from the description drawer — plain Enter
          // in a textarea should insert a newline (matches every other multi-
          // line input in the app; Slack/Discord follow the same convention).
          if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey) && !ev.isComposing) {
            ev.preventDefault();
            submit();
          } else if (
            ev.key === 'ArrowUp' &&
            !ev.shiftKey &&
            !ev.metaKey &&
            descEl.selectionStart === 0
          ) {
            // At the top of the description, ArrowUp jumps focus back to
            // the title. Cursor at start ensures we only steal focus when
            // the user is trying to leave the drawer, not when they're
            // editing within it.
            ev.preventDefault();
            titleEl.focus();
          }
        });

        // Explicit Save button in the description drawer. mousedown +
        // preventDefault keeps focus off the button (so the textarea isn't
        // blurred mid-submit); the actual submit fires on click.
        descSave.addEventListener('mousedown', (ev) => ev.preventDefault());
        descSave.addEventListener('click', () => submit());

        window.addEventListener('focus', () => titleEl.focus());
        titleEl.focus();
        loadProjects();
      })();
    </script>
  </body>
</html>
