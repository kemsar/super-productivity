<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src http://127.0.0.1:3876"
    />
    <title>Quick Add</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1e1e1e;
        --fg: #f5f5f5;
        --fg-muted: #999;
        --border: #333;
        --accent: #4f8dff;
        --error: #ff5252;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 20px;
        box-sizing: border-box;
      }
      .hint {
        font-size: 12px;
        color: var(--fg-muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 10px;
      }
      #input {
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        color: var(--fg);
        font-size: 22px;
        line-height: 1.3;
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
      }
      #input:focus {
        border-bottom-color: var(--accent);
      }
      #status {
        margin-top: 12px;
        font-size: 13px;
        min-height: 18px;
        color: var(--fg-muted);
      }
      #status.error {
        color: var(--error);
      }
      #status.saving {
        color: var(--accent);
      }
      .keys {
        margin-top: auto;
        display: flex;
        gap: 16px;
        font-size: 11px;
        color: var(--fg-muted);
      }
      kbd {
        background: #2a2a2a;
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 2px 6px;
        font-family: inherit;
        font-size: 10px;
        margin-right: 4px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="hint">Quick add task</div>
      <input
        id="input"
        type="text"
        autofocus
        placeholder="What's on your mind?"
        autocomplete="off"
        spellcheck="false"
      />
      <div id="status"></div>
      <div class="keys">
        <span><kbd>Enter</kbd>save</span>
        <span><kbd>Esc</kbd>cancel</span>
      </div>
    </div>
    <script>
      // Self-contained overlay logic. Talks to SP via the local REST API on
      // 127.0.0.1:3876 (POST /tasks). See electron/quick-add-window.ts for
      // the enclosing BrowserWindow lifecycle and issue #25 for the plan.
      (function () {
        const REST = 'http://127.0.0.1:3876';
        const input = document.getElementById('input');
        const status = document.getElementById('status');

        function setStatus(text, cls) {
          status.textContent = text;
          status.className = cls || '';
        }

        async function submit() {
          const title = input.value.trim();
          if (!title) return;
          setStatus('Saving…', 'saving');
          try {
            const res = await fetch(REST + '/tasks', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ title }),
            });
            if (!res.ok) {
              const body = await res.text();
              setStatus('Save failed (' + res.status + '): ' + body, 'error');
              return;
            }
            // Reset on success; user might want to add another. If they meant
            // to close, Esc still closes. This matches Alfred-style rapid
            // capture ergonomics.
            input.value = '';
            setStatus('Saved.', '');
            // Close after a short pause so the "Saved." confirmation is
            // perceivable but doesn't stall the workflow.
            setTimeout(() => {
              window.close();
            }, 350);
          } catch (err) {
            setStatus('Save error: ' + (err && err.message ? err.message : err), 'error');
          }
        }

        input.addEventListener('keydown', (ev) => {
          if (ev.key === 'Escape') {
            ev.preventDefault();
            window.close();
            return;
          }
          if (ev.key === 'Enter' && !ev.isComposing) {
            ev.preventDefault();
            submit();
          }
        });

        // Re-focus on show. Electron's `ready-to-show` fires before the
        // <input autofocus> takes effect in some cases; belt-and-suspenders.
        window.addEventListener('focus', () => input.focus());
        input.focus();
      })();
    </script>
  </body>
</html>
