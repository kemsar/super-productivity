<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      `script-src 'self' 'unsafe-inline'` — `'self'` lets us pull the
      shared parser out of `./shared-with-frontend/` as a plain `<script src>`,
      `'unsafe-inline'` covers the overlay's own logic. Not swapping to
      `type="module"` on purpose: Electron file:// origins block ES-module
      imports on CORS, and a UMD-shaped parser (see quick-add-parser.js)
      dodges the problem without a preload or bundler in the loop.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src http://127.0.0.1:3876"
    />
    <title>Quick Add</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1e1e1e;
        --fg: #f5f5f5;
        --fg-muted: #999;
        --border: #333;
        --accent: #4f8dff;
        --error: #ff5252;
        --warn: #ffb347;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 20px;
        box-sizing: border-box;
      }
      .hint {
        font-size: 12px;
        color: var(--fg-muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 10px;
      }
      /* Title line — a single-line textarea (rows=1) so Enter can carry the
         "submit" semantic while Shift+Enter (or a downward-arrow keystroke)
         drops into the description drawer. `resize:none` and a hard-coded
         height keep the overlay's chrome stable. */
      #title {
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        color: var(--fg);
        font-size: 22px;
        line-height: 1.3;
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
        resize: none;
        font-family: inherit;
        overflow: hidden;
        height: 34px;
      }
      #title:focus {
        border-bottom-color: var(--accent);
      }
      /* Description drawer — hidden until the user pushes Enter-with-Shift
         or the down-arrow / Tab. Grows organically; capped at ~5 lines then
         scrolls. Muted styling keeps it visually secondary to the title. */
      #description {
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        color: var(--fg-muted);
        font-size: 14px;
        line-height: 1.4;
        padding: 8px 0 0;
        resize: none;
        font-family: inherit;
        min-height: 24px;
        max-height: 110px;
      }
      #description.hidden {
        display: none;
      }
      #description::placeholder {
        color: var(--fg-muted);
        opacity: 0.6;
      }
      #status {
        margin-top: 12px;
        font-size: 13px;
        min-height: 18px;
        color: var(--fg-muted);
      }
      #status.error {
        color: var(--error);
      }
      #status.saving {
        color: var(--accent);
      }
      /* Project autocomplete dropdown — appears while the caret is inside
         a !<token> region. Positioned absolutely below the title textarea
         so it doesn't push other UI around when opened. Highlighted item
         gets the accent-tinted background; keyboard nav + click both
         select. Capped at a scroll-y list so a large project list stays
         usable. */
      .autocomplete {
        position: absolute;
        top: 74px;
        left: 20px;
        right: 20px;
        max-height: 180px;
        overflow-y: auto;
        background: #262626;
        border: 1px solid var(--border);
        border-radius: 4px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        z-index: 10;
      }
      .autocomplete.hidden {
        display: none;
      }
      .autocomplete .row {
        padding: 6px 12px;
        font-size: 13px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .autocomplete .row .hint-key {
        color: var(--fg-muted);
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 11px;
      }
      .autocomplete .row.active,
      .autocomplete .row:hover {
        background: rgba(79, 141, 255, 0.18);
        color: var(--accent);
      }
      .autocomplete .empty {
        padding: 8px 12px;
        font-size: 12px;
        color: var(--fg-muted);
        font-style: italic;
      }
      /* Live-parsed preview — a strip of chips populated by the parser.
         Each chip labels the token kind and shows the resolved value (or an
         unresolved warning). The whole strip hides when there's nothing to
         show, so a plain "walk the dog" title has zero decoration. */
      .parse-preview {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 12px;
        min-height: 22px;
      }
      .parse-preview .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: rgba(79, 141, 255, 0.15);
        color: var(--accent);
        border-radius: 3px;
        padding: 2px 8px;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 11px;
        line-height: 1.4;
      }
      .parse-preview .chip .k {
        color: var(--fg-muted);
      }
      .parse-preview .chip.warn {
        background: rgba(255, 179, 71, 0.15);
        color: var(--warn);
      }
      .parse-preview .chip.error {
        background: rgba(255, 82, 82, 0.15);
        color: var(--error);
      }
      .keys {
        margin-top: auto;
        display: flex;
        gap: 16px;
        font-size: 11px;
        color: var(--fg-muted);
        flex-wrap: wrap;
      }
      kbd {
        background: #2a2a2a;
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 2px 6px;
        font-family: inherit;
        font-size: 10px;
        margin-right: 4px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="hint">Quick add task</div>
      <textarea
        id="title"
        rows="1"
        autofocus
        placeholder="What's on your mind?"
        autocomplete="off"
        spellcheck="false"
        aria-label="Task title with optional !project @user ##milestone ~date !!priority >status tokens"
      ></textarea>
      <textarea
        id="description"
        class="hidden"
        rows="1"
        placeholder="Description (optional)"
        autocomplete="off"
        spellcheck="false"
        aria-label="Task description"
      ></textarea>
      <div
        id="project-autocomplete"
        class="autocomplete hidden"
        role="listbox"
        aria-label="Project suggestions"
      ></div>
      <div
        id="parse-preview"
        class="parse-preview"
      ></div>
      <div id="status"></div>
      <div class="keys">
        <span><kbd>Enter</kbd>save</span>
        <span><kbd>Shift+Enter</kbd>description</span>
        <span
          ><kbd>!prj</kbd> <kbd>@who</kbd> <kbd>##ms</kbd> <kbd>~date</kbd>
          <kbd>!!pri</kbd> <kbd>&gt;stat</kbd></span
        >
        <span><kbd>Esc</kbd>cancel</span>
      </div>
    </div>
    <!--
      Load the shared parser via plain <script src>. See the CSP comment
      above for why we're NOT using type="module" here. `SPQuickAddParser`
      lands as a global containing `parseQuickAddText` / `resolveDateToken`.
    -->
    <script src="./shared-with-frontend/quick-add-parser.js"></script>
    <script>
      // Self-contained overlay logic. Talks to SP via the local REST API on
      // 127.0.0.1:3876 (GET /projects, POST /tasks). Grammar/parsing lives
      // in shared-with-frontend/quick-add-parser.js so the Angular effect
      // can re-parse from the same source (issue #19).
      (function () {
        const REST = 'http://127.0.0.1:3876';
        const titleEl = document.getElementById('title');
        const descEl = document.getElementById('description');
        const status = document.getElementById('status');
        const preview = document.getElementById('parse-preview');
        const autocompleteEl = document.getElementById('project-autocomplete');
        const parseText = window.SPQuickAddParser
          ? window.SPQuickAddParser.parseQuickAddText
          : null;

        // Autocomplete state — populated as the user types inside a `!token`
        // region. `matches` is the filtered list; `activeIndex` is the
        // currently highlighted row. Keeping it in a small object keeps the
        // pick/render/keyboard-nav helpers coherent.
        const acState = { open: false, matches: [], activeIndex: 0, tokenRange: null };

        if (!parseText) {
          // Parser failed to load — the overlay is unusable. Fail loud so
          // devtools shows the reason rather than pretending to work with a
          // degraded (project-marker-only) grammar the user won't notice.
          status.textContent = 'Parser failed to load — check devtools.';
          status.className = 'error';
        }

        // Projects, loaded once on open. Small enough to cache in memory;
        // token/title comparisons stay case-insensitive so `!odin-pipes`
        // matches "ODIN Pipes" without hyphen-vs-space bikeshedding.
        let projects = [];

        async function loadProjects() {
          try {
            const res = await fetch(REST + '/projects');
            if (!res.ok) return;
            const body = await res.json();
            projects = Array.isArray(body) ? body : body.data || [];
          } catch (err) {
            console.warn('[quick-add] failed to load projects', err);
          }
        }

        function normalize(s) {
          return String(s || '')
            .toLowerCase()
            .replace(/[^a-z0-9]/g, '');
        }

        function resolveProject(token) {
          if (!token) return null;
          const needle = normalize(token);
          if (!needle) return null;
          const exact = projects.find((p) => normalize(p.title) === needle);
          if (exact) return exact;
          // Only fall back to prefix if there's a UNIQUE prefix match.
          // Otherwise the resolver was silently picking whichever project
          // sorted first, which surprised users with multi-project
          // acronyms like "!EIP" (matches both EIP Work and EIP Team).
          // Ambiguous input should surface via the autocomplete dropdown,
          // not get auto-resolved.
          const prefixMatches = projects.filter((p) =>
            normalize(p.title).startsWith(needle),
          );
          return prefixMatches.length === 1 ? prefixMatches[0] : null;
        }

        // Returns all projects whose normalized title starts with the
        // needle, in original order. Used to populate the dropdown.
        // Empty needle → return all projects (opening the dropdown right
        // after typing `!` shows the full list, Todoist-style).
        function listProjectMatches(token) {
          const needle = normalize(token);
          if (!needle) return projects.slice();
          return projects.filter((p) => normalize(p.title).startsWith(needle));
        }

        // Detects whether the caret is currently inside a `!<token>` region
        // in the title textarea. Returns { start, end, value } if so — where
        // `start` is the index of the `!`, `end` is one past the token's
        // last non-whitespace char, and `value` is the token text after the
        // `!` (may be empty right after typing `!`). Returns null otherwise.
        //
        // The `!` must be at position 0 OR immediately after whitespace, so
        // an email-style `foo!bar` doesn't trigger the dropdown.
        function findProjectTokenAtCaret() {
          const raw = titleEl.value;
          const caret = titleEl.selectionStart;
          if (caret == null) return null;
          // Scan backwards from the caret for a `!` that starts a token.
          let start = caret - 1;
          while (start >= 0 && !/\s/.test(raw[start]) && raw[start] !== '!') {
            start--;
          }
          if (start < 0 || raw[start] !== '!') return null;
          if (start > 0 && !/\s/.test(raw[start - 1])) return null;
          // Extend forward until whitespace or EOL.
          let end = caret;
          while (end < raw.length && !/\s/.test(raw[end])) {
            end++;
          }
          // The value doesn't include the `!` itself.
          return { start, end, value: raw.slice(start + 1, end) };
        }

        function renderAutocomplete() {
          if (!acState.open || acState.matches.length === 0) {
            autocompleteEl.classList.add('hidden');
            autocompleteEl.innerHTML = '';
            return;
          }
          autocompleteEl.classList.remove('hidden');
          autocompleteEl.innerHTML = '';
          acState.matches.forEach((project, i) => {
            const row = document.createElement('div');
            row.className = 'row' + (i === acState.activeIndex ? ' active' : '');
            row.setAttribute('role', 'option');
            row.setAttribute(
              'aria-selected',
              i === acState.activeIndex ? 'true' : 'false',
            );
            row.innerHTML =
              '<span>' +
              escapeHtml(project.title) +
              '</span>' +
              (i === acState.activeIndex ? '<span class="hint-key">↵/Tab</span>' : '');
            row.addEventListener('mousedown', (ev) => {
              // mousedown (not click) so the textarea keeps focus — the
              // click event would fire AFTER a blur that we don't want.
              ev.preventDefault();
              pickProject(i);
            });
            autocompleteEl.appendChild(row);
          });
        }

        // Refresh acState from the caret position + input. Called on every
        // input event and after picks. When the caret leaves the token
        // region, the dropdown closes.
        function updateAutocomplete() {
          const token = findProjectTokenAtCaret();
          if (!token) {
            acState.open = false;
            acState.matches = [];
            acState.tokenRange = null;
            renderAutocomplete();
            return;
          }
          const matches = listProjectMatches(token.value);
          acState.open = matches.length > 0;
          acState.matches = matches;
          acState.tokenRange = { start: token.start, end: token.end };
          // Reset the highlight to the top whenever the match set changes.
          // Clamping keeps it valid if the previous activeIndex became
          // out-of-bounds after filtering.
          if (acState.activeIndex >= acState.matches.length) {
            acState.activeIndex = 0;
          }
          renderAutocomplete();
        }

        // Replaces the `!token` region with `!<hyphenated-title>` and moves
        // the caret to right after it (plus a trailing space so the next
        // token can be typed immediately). Hyphenation is the concession
        // the whitespace-terminated grammar forces: `!EIP Team` can't be a
        // single token, but `!EIP-Team` can — and the resolver's
        // `normalize` strips hyphens anyway, so the match still works.
        function pickProject(index) {
          if (!acState.tokenRange || !acState.matches[index]) return;
          const project = acState.matches[index];
          const hyphenated = String(project.title).replace(/\s+/g, '-');
          const insert = '!' + hyphenated + ' ';
          const raw = titleEl.value;
          const { start, end } = acState.tokenRange;
          const before = raw.slice(0, start);
          const after = raw.slice(end);
          titleEl.value = before + insert + after;
          const newCaret = before.length + insert.length;
          titleEl.setSelectionRange(newCaret, newCaret);
          acState.open = false;
          acState.matches = [];
          acState.tokenRange = null;
          renderAutocomplete();
          updatePreview();
        }

        function escapeHtml(s) {
          return String(s).replace(/[&<>"']/g, (c) => {
            switch (c) {
              case '&':
                return '&amp;';
              case '<':
                return '&lt;';
              case '>':
                return '&gt;';
              case '"':
                return '&quot;';
              default:
                return '&#39;';
            }
          });
        }

        function chip(kind, value, cls) {
          const c = document.createElement('span');
          c.className = 'chip' + (cls ? ' ' + cls : '');
          c.innerHTML =
            '<span class="k">' + escapeHtml(kind) + '</span>' + escapeHtml(value);
          return c;
        }

        // Build the raw input the parser expects. Line 1 is the title
        // textarea's content; line 2+ is the description drawer if it has
        // any text. Keeping the textareas separate on-screen but joining
        // them at parse time lets the parser stay a single-string function.
        function currentRaw() {
          const t = titleEl.value;
          const d = descEl.value;
          return d.length ? t + '\n' + d : t;
        }

        function updatePreview() {
          if (!parseText) return;
          preview.innerHTML = '';
          const parsed = parseText(currentRaw());

          if (parsed.projectMarker) {
            const project = resolveProject(parsed.projectMarker);
            if (project) {
              preview.appendChild(chip('project', project.title));
            } else {
              preview.appendChild(
                chip('project', '!' + parsed.projectMarker + ' (no match)', 'error'),
              );
            }
          }
          for (const a of parsed.assignees) {
            preview.appendChild(chip('assign', '@' + a));
          }
          if (parsed.milestone) {
            preview.appendChild(chip('milestone', parsed.milestone));
          }
          if (parsed.dueDate) {
            preview.appendChild(chip('due', parsed.dueDate));
          } else if (parsed.dueDateRaw) {
            preview.appendChild(chip('due', '~' + parsed.dueDateRaw + ' (?)', 'warn'));
          }
          if (parsed.priority) {
            preview.appendChild(chip('priority', parsed.priority));
          } else if (parsed.priorityRaw) {
            preview.appendChild(
              chip('priority', '!!' + parsed.priorityRaw + ' (?)', 'warn'),
            );
          }
          if (parsed.status) {
            preview.appendChild(chip('status', parsed.status));
          }
          if (parsed.description) {
            const len = parsed.description.length;
            preview.appendChild(chip('desc', len + (len === 1 ? ' char' : ' chars')));
          }
        }

        function setStatus(text, cls) {
          status.textContent = text;
          status.className = cls || '';
        }

        function showDescription() {
          descEl.classList.remove('hidden');
        }

        async function submit() {
          if (!parseText) return;
          const parsed = parseText(currentRaw());
          if (!parsed.title) return;
          // If the user typed a `!token` that didn't resolve, fail loud
          // rather than silently dropping the marker and posting to Inbox.
          let projectId;
          if (parsed.projectMarker) {
            const project = resolveProject(parsed.projectMarker);
            if (!project) {
              setStatus('No project matches "!' + parsed.projectMarker + '"', 'error');
              return;
            }
            projectId = project.id;
          }
          setStatus('Saving…', 'saving');
          // Send the RAW title (tokens included) so the auto-create effect
          // can re-parse it as the single source of truth for BOTH overlay
          // and in-app quick-add entries. `notes` carries the description
          // directly — SP's task-notes field is exactly the concept the
          // overlay's description drawer captures. The SP task briefly
          // shows the raw tokens between add-task and retro-link (~1s),
          // then the retro-link replaces the title with `#N <clean>` and
          // sets task.dueDay from the ~date token (issue #19).
          const body = { title: parsed.rawTitle };
          if (projectId) body.projectId = projectId;
          if (parsed.description) body.notes = parsed.description;
          try {
            const res = await fetch(REST + '/tasks', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            if (!res.ok) {
              const errBody = await res.text();
              setStatus('Save failed (' + res.status + '): ' + errBody, 'error');
              return;
            }
            titleEl.value = '';
            descEl.value = '';
            descEl.classList.add('hidden');
            updatePreview();
            setStatus('Saved.', '');
            setTimeout(() => {
              window.close();
            }, 350);
          } catch (err) {
            setStatus('Save error: ' + (err && err.message ? err.message : err), 'error');
          }
        }

        // Title input handlers: keep the field single-line by intercepting
        // Enter. Shift+Enter and ArrowDown both open the description drawer
        // and move focus — either gesture feels natural (Shift+Enter matches
        // Slack/Discord/GitHub; ArrowDown matches Alfred/Raycast panel nav).
        //
        // When the project-autocomplete dropdown is open, ArrowUp/Down
        // navigate it, Enter/Tab pick, Esc closes the dropdown (does NOT
        // cancel the window). Any other input closes the dropdown by
        // falling through to updateAutocomplete on 'input' below.
        titleEl.addEventListener('input', () => {
          updateAutocomplete();
          updatePreview();
        });
        // Selection changes (arrow-key movement without typing) also need
        // to update autocomplete visibility — moving out of the token
        // region should close the dropdown.
        titleEl.addEventListener('click', updateAutocomplete);
        titleEl.addEventListener('keyup', (ev) => {
          if (ev.key.startsWith('Arrow') || ev.key === 'Home' || ev.key === 'End') {
            updateAutocomplete();
          }
        });
        // Handles arrow-nav / pick / dismiss for the project-autocomplete
        // dropdown. Returns true if the event was consumed (caller should
        // not fall through to the default title-textarea handling).
        function handleAutocompleteKey(ev) {
          if (!acState.open) return false;
          if (ev.shiftKey || ev.metaKey) return false;
          if (ev.key === 'ArrowDown') {
            ev.preventDefault();
            acState.activeIndex = (acState.activeIndex + 1) % acState.matches.length;
            renderAutocomplete();
            return true;
          }
          if (ev.key === 'ArrowUp') {
            ev.preventDefault();
            acState.activeIndex =
              (acState.activeIndex - 1 + acState.matches.length) % acState.matches.length;
            renderAutocomplete();
            return true;
          }
          if ((ev.key === 'Enter' || ev.key === 'Tab') && !ev.isComposing) {
            ev.preventDefault();
            pickProject(acState.activeIndex);
            return true;
          }
          if (ev.key === 'Escape') {
            // Close the dropdown, but leave the window open — Esc-to-cancel
            // requires a second press when the dropdown was open.
            ev.preventDefault();
            acState.open = false;
            acState.matches = [];
            renderAutocomplete();
            return true;
          }
          return false;
        }

        titleEl.addEventListener('keydown', (ev) => {
          if (handleAutocompleteKey(ev)) return;
          if (ev.key === 'Escape') {
            ev.preventDefault();
            window.close();
            return;
          }
          if (ev.key === 'Enter' && !ev.isComposing) {
            ev.preventDefault();
            if (ev.shiftKey) {
              showDescription();
              descEl.focus();
              return;
            }
            submit();
          } else if (ev.key === 'ArrowDown' && !ev.shiftKey && !ev.metaKey) {
            ev.preventDefault();
            showDescription();
            descEl.focus();
          }
        });

        descEl.addEventListener('input', updatePreview);
        descEl.addEventListener('keydown', (ev) => {
          if (ev.key === 'Escape') {
            ev.preventDefault();
            window.close();
            return;
          }
          // Cmd/Ctrl+Enter submits from the description drawer — plain Enter
          // in a textarea should insert a newline (matches every other multi-
          // line input in the app; Slack/Discord follow the same convention).
          if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey) && !ev.isComposing) {
            ev.preventDefault();
            submit();
          } else if (
            ev.key === 'ArrowUp' &&
            !ev.shiftKey &&
            !ev.metaKey &&
            descEl.selectionStart === 0
          ) {
            // At the top of the description, ArrowUp jumps focus back to
            // the title. Cursor at start ensures we only steal focus when
            // the user is trying to leave the drawer, not when they're
            // editing within it.
            ev.preventDefault();
            titleEl.focus();
          }
        });

        window.addEventListener('focus', () => titleEl.focus());
        titleEl.focus();
        loadProjects();
      })();
    </script>
  </body>
</html>
